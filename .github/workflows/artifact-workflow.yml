name: artifact-workflow.yml

on:
  pull_request:
    paths:
      - "packages/agent-chat-minimal/**"
      - "application/frontend/frontend/**"
      - "tests/ui/**"
      - ".github/workflows/artifact-workflow.yml"
      - ".github/workflows/publish-workflow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifacts:
    name: Build and smoke-test package artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: application/frontend/frontend/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - name: Build wheel and sdist
        run: packages/agent-chat-minimal/scripts/build_wheel.sh
      - name: Check archives
        run: |
          uv run --with twine twine check packages/agent-chat-minimal/dist/*
          for artifact in packages/agent-chat-minimal/dist/*; do
            packages/agent-chat-minimal/scripts/smoke_test_wheel.sh "$artifact"
          done
      - name: Install prefix browser-test dependencies
        run: |
          pnpm --dir tests/ui install --frozen-lockfile
          pnpm --dir tests/ui exec playwright install --with-deps chromium
      - name: Verify installed wheel and sdist under URL prefixes
        run: |
          for artifact in packages/agent-chat-minimal/dist/*; do
            venv="$(mktemp -d)/venv"
            uv venv --python 3.11 "$venv"
            uv pip install --python "$venv/bin/python" "$artifact"
            UI_PYTHON="$venv/bin/python" node tests/ui/scripts/verify-prefix.mjs
          done
      - uses: actions/upload-artifact@v4
        with:
          name: agent-chat-minimal-dist
          path: packages/agent-chat-minimal/dist/

  e2e-packaged:
    name: Packaged-app browser e2e (@packaged)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: application/frontend/frontend/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - name: Install frontend dependencies
        run: pnpm --dir application/frontend/frontend install --frozen-lockfile
      - name: Install Playwright chromium
        run: pnpm --dir application/frontend/frontend exec playwright install --with-deps chromium
      - name: Build static UI served by the e2e fake backend
        run: pnpm --dir application/frontend/frontend build
      - name: Sync package test environment for the e2e fake backend
        run: uv sync --project packages/agent-chat-minimal --extra test
      - name: Run @packaged suites (self-contained, no credentials)
        working-directory: application/frontend/frontend
        env:
          CI: "true"
          E2E_PYTHON: ${{ github.workspace }}/packages/agent-chat-minimal/.venv/bin/python
        run: |
          pnpm playwright test -c e2e/thread-sync.config.ts
          pnpm playwright test -c e2e/chat-actions.config.ts
          pnpm playwright test -c e2e/code-formatting.config.ts
          pnpm playwright test -c e2e/backend-base.config.ts
          pnpm playwright test -c e2e/error-debug.config.ts
          pnpm playwright test -c e2e/error-prod.config.ts
          pnpm playwright test -c e2e/provider-error-debug.config.ts
          pnpm playwright test -c e2e/provider-error-prod.config.ts
