name: publish-workflow.yml

# Publishes packages/agent-chat-minimal to PyPI as
# `agent-chat-fastapi-langgraph-assistant-ui` via PyPI Trusted Publishing
# (OIDC) - no API token is stored in GitHub. The repo must be registered as a
# trusted publisher for the `agent-chat-fastapi-langgraph-assistant-ui` PyPI
# project with workflow filename `publish-workflow.yml`.
#
# Release flow:
#   1. (Maintainer) bump the package version source.
#   2. Publish a GitHub Release, ideally tagged
#      `agent-chat-fastapi-langgraph-assistant-ui-vX.Y.Z` matching the bumped
#      version - the workflow fails fast on mismatch.
#   3. This workflow rebuilds the unified frontend static export (one build,
#      minimal/full presets selected at runtime via /api/config) -
#      (Node/pnpm are CI-only; people installing from PyPI need Python
#      only), runs the offline serving tests, builds the sdist + wheel,
#      and uploads them.
#
# If the PyPI trusted publisher entry restricts publishing to a GitHub
# Environment, add `environment: <name>` to the `publish` job below.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for PyPI trusted publishing (OIDC)
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: application/frontend/frontend/pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build staged wheel and sdist
        run: packages/agent-chat-minimal/scripts/build_wheel.sh

      - name: Check release tag matches package version
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("packages/agent-chat-minimal/pyproject.toml", "rb"))["project"]["version"])')"
          tag="${{ github.event.release.tag_name }}"
          echo "package version: $version"
          echo "release tag: $tag"
          if [[ "$tag" != "agent-chat-fastapi-langgraph-assistant-ui-v$version" ]]; then
            echo "::error::Release tag must be agent-chat-fastapi-langgraph-assistant-ui-v$version"
            exit 1
          fi

      - name: Install package with test extras
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "./packages/agent-chat-minimal[test]"

      - name: Run offline serving tests
        run: python3 -m pytest packages/agent-chat-minimal

      - name: Verify distributions
        run: |
          set -euo pipefail
          python3 -m twine check packages/agent-chat-minimal/dist/*
          python3 - <<'EOF'
          import glob
          import tarfile
          import zipfile

          sdists = glob.glob("packages/agent-chat-minimal/dist/*.tar.gz")
          wheels = glob.glob("packages/agent-chat-minimal/dist/*.whl")
          assert len(sdists) == 1, sdists
          assert len(wheels) == 1, wheels

          with tarfile.open(sdists[0]) as tar:
              names = tar.getnames()
              assert any(name.endswith("/src/agent_chat_minimal/web/index.html") for name in names), "sdist is missing the bundled UI"
              assert not any("/web_full/" in name for name in names), "sdist must not bundle the removed web_full UI"

          with zipfile.ZipFile(wheels[0]) as whl:
              names = whl.namelist()
              assert "agent_chat_minimal/web/index.html" in names, "wheel is missing the bundled UI"
              assert not any(name.startswith("agent_chat_minimal/web_full/") for name in names), "wheel must not bundle the removed web_full UI"

          print("distributions verified: sdist and wheel bundle the unified UI")
           EOF

      - name: Smoke-test installed archives without Node
        run: |
          set -euo pipefail
          for artifact in packages/agent-chat-minimal/dist/*; do
            packages/agent-chat-minimal/scripts/smoke_test_wheel.sh "$artifact"
          done

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/agent-chat-minimal/dist
          print-hash: true
