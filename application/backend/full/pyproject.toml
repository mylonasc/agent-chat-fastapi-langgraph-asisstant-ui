[project]
name = "fastlang"
version = "0.1.0"
description = "A langgraph + FastAPI server for assistant UI, supporting multiple chats."
readme = "README.md"
requires-python = ">=3.11,<=3.14"
dependencies = [
    "assistant-stream-ce>=0.0.2",
    "fastapi>=0.127.0",
    "langchain>=1.2.0",
    "langgraph>=1.0.5",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.2.0",
    "rank-bm25>=0.2.2",
    "fastembed>=0.3.6",
    "faiss-cpu>=1.8.0",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]

# CPU-only sentence transformers (torch CPU)
sentence-cpu = [
    "sentence-transformers>=2.7.0",
]

# GPU-enabled sentence transformers (expects CUDA-enabled torch resolution)
sentence-gpu = [
    "sentence-transformers>=2.7.0",
]

# GPU FAISS backend
gpu = [
    "faiss-gpu>=1.8.0",
]
