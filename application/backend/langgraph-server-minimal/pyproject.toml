[project]
name = "langgraph-server-minimal"
version = "0.1.0"
description = "Minimal langgraph + FastAPI server for assistant UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "assistant-stream-ce>=0.0.2",
    "fastapi>=0.127.0",
    "langchain>=1.2.0",
    "langgraph>=1.0.5",
    "langchain-openai>=0.2.0",
    "uvicorn>=0.34.0",
]

[project.scripts]
server = "server:app"
