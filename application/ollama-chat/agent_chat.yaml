version: 1
host: 127.0.0.1
port: 8011
model: ollama:llama3.2:latest
default_agent: chat
ui_preset: full
persistence_enabled: true
database_path: data/chat.db
checkpoint_database_path: data/checkpoints.db
ui:
  title: Local Ollama Chat
  welcome_heading: Chat with your local LLM
  welcome_description: Ask questions, write code, or explore ideas. Responses are generated by your local Ollama model.
  composer_placeholder: Message your local assistant...
  questions:
    - id: explain
      label: Explain a concept
      prompt: Explain how large language models work in simple terms.
      agents: [chat]
    - id: code
      label: Help me code
      prompt: Write a Python function that checks whether a word is a palindrome, with a short explanation.
      agents: [chat]
    - id: brainstorm
      label: Brainstorm ideas
      prompt: Suggest three fun projects I can build with a local language model.
      agents: [chat]
