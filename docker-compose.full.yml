services:
  backend-full:
    build:
      context: ./application/backend/full
      dockerfile: Dockerfile
      args:
        DOCLING_VARIANT: ${DOCLING_VARIANT:-none}
    ports:
      - "8010:8010"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SERPER_API_KEY=${SERPER_API_KEY}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-fastembed}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-}
      - AGENT_MODE=${AGENT_MODE:-react}
    env_file:
      - .env
    volumes:
      - ./application/backend/full/data:/app/data

  frontend-full:
    build:
      context: ./application/frontend/frontend-full
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8010
    depends_on:
      - backend-full
