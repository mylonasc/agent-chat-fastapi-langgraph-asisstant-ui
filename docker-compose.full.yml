name: agent-chat-full

services:
  backend-full:
    build:
      context: .
      dockerfile: scripts/Dockerfile.backend
      args:
        ALLOWED_TOOLSETS: ${ALLOWED_TOOLSETS-${TOOLSETS-calculator,weather,graph}}
    ports:
      - "8010:8010"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SERPER_API_KEY=${SERPER_API_KEY}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-fastembed}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-}
      - AGENT_MODE=${AGENT_MODE:-react}
      - DOCLING_VARIANT=${DOCLING_VARIANT:-none}
      - RAG_STARTUP_VALIDATION=${RAG_STARTUP_VALIDATION:-0}
      - UI_PRESET=full
      - PORT=8010
      - API_BASE=http://localhost:8010
      - TOOLSETS=${TOOLSETS-calculator,weather,graph}
    env_file:
      - .env
    volumes:
      - demo-full-data:/app/data
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  frontend-full:
    build:
      context: ./application/frontend/frontend
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8010
    depends_on:
      backend-full:
        condition: service_healthy

volumes:
  demo-full-data:
