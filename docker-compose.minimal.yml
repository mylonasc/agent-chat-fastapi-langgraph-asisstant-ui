name: agent-chat-minimal

services:
  backend-minimal:
    build:
      context: .
      dockerfile: application/backend/langgraph-server-minimal/Dockerfile
    ports:
      - "8011:8011"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - API_BASE=http://localhost:8011
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8011/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  frontend-minimal:
    build:
      context: ./application/frontend/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8011
    depends_on:
      backend-minimal:
        condition: service_healthy
