name: agent-chat-minimal

services:
  backend-minimal:
    build:
      context: .
      dockerfile: scripts/Dockerfile.backend
      args:
        ALLOWED_TOOLSETS: ${ALLOWED_TOOLSETS-${TOOLSETS-calculator,weather,graph}}
    ports:
      - "8011:8011"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - API_BASE=http://localhost:8011
      - UI_PRESET=minimal
      - PORT=8011
      - TOOLSETS=${TOOLSETS-calculator,weather,graph}
    env_file:
      - .env
    volumes:
      - demo-minimal-data:/app/data
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8011/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  frontend-minimal:
    build:
      context: ./application/frontend/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8011
    depends_on:
      backend-minimal:
        condition: service_healthy

volumes:
  demo-minimal-data:
