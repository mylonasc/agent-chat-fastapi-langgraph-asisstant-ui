[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-chat-fastapi-langgraph-assistant-ui"
dynamic = ["version"]
description = "Portable FastAPI and LangGraph chat with a bundled static UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "assistant-stream-ce==0.0.2",
    "fastapi>=0.127.0",
    "langchain>=1.2.0",
    "langchain-openai>=0.2.0",
    "langgraph>=1.0.5",
    "typing-extensions>=4.8.0",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
openai = [
    "langchain-openai>=0.2.0",
]
anthropic = [
    "langchain-anthropic>=0.3.0,<2",
]
google = [
    "langchain-google-genai>=2.0.0,<4",
]
persistence = [
    "SQLAlchemy[asyncio]>=2.0.36,<3",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "langgraph-checkpoint-sqlite>=3.1.1,<4",
]
ollama = [
    "langchain-ollama>=1.0.0,<2",
]
test = [
    "SQLAlchemy[asyncio]>=2.0.36,<3",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "langgraph-checkpoint-sqlite>=3.1.1,<4",
    "build>=1.2.2",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[project.scripts]
minimal-chat-serve = "agent_chat_minimal.server:main"
minimal-chat-migrate = "agent_chat_minimal.adapters.sqlite:migration_main"

# Third-party agents register here, e.g.
# [project.entry-points."agent_chat.agents"]
# my_agent = "my_package.my_module:make_my_agent"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_chat_minimal"]
artifacts = ["src/agent_chat_minimal/migrations/**/*.py"]
# The tracked .gitkeep placeholders would otherwise be collected twice (once
# via `packages`, once via `force-include`) and fail the build with "A second
# file is being added to the wheel archive at the same path".
exclude = ["**/.gitkeep"]

[tool.hatch.version]
path = "src/agent_chat_minimal/__init__.py"

[tool.hatch.build.targets.wheel.force-include]
"src/agent_chat_minimal/web" = "agent_chat_minimal/web"

# The sdist file list comes from git, where the staged prebuilt UI is
# ignored - so it must be force-included here (staged from
# application/frontend/frontend/out before building).
# python -m build builds the wheel from the sdist, so without this the PyPI
# wheel would ship without the UI.
[tool.hatch.build.targets.sdist]
artifacts = ["src/agent_chat_minimal/migrations/**/*.py"]

[tool.hatch.build.targets.sdist.force-include]
"src/agent_chat_minimal/web" = "src/agent_chat_minimal/web"
