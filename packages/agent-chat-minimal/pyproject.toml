[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-chat-fastapi-langgraph-assistant-ui"
version = "0.2.0"
description = "Portable FastAPI and LangGraph chat with a bundled static UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "assistant-stream-ce>=0.0.2",
    "fastapi>=0.127.0",
    "langchain>=1.2.0",
    "langchain-openai>=0.2.0",
    "langgraph>=1.0.5",
    "typing-extensions>=4.8.0",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[project.scripts]
minimal-chat-serve = "agent_chat_minimal.server:main"

# Third-party agents register here, e.g.
# [project.entry-points."agent_chat.agents"]
# my_agent = "my_package.my_module:make_my_agent"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_chat_minimal"]

[tool.hatch.build.targets.wheel.force-include]
"src/agent_chat_minimal/web" = "agent_chat_minimal/web"

# The sdist must also bundle the prebuilt static UI (which is gitignored and
# staged from application/frontend/frontend-minimal/out before building).
# python -m build builds the wheel from the sdist, so without this the PyPI
# wheel would ship without the UI.
[tool.hatch.build.targets.sdist.force-include]
"src/agent_chat_minimal/web" = "src/agent_chat_minimal/web"
